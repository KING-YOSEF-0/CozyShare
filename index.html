<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>CozyShare · Developer: KING_YOSEF_Andn</title>
  <style>
    /* ========== RED & BLACK BUBBLY COZY THEME ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 30%, #1e0a0a, #0b0202);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
      position: relative;
      overflow-x: hidden;
    }

    /* bubble background effect */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 80% 70%, rgba(255, 60, 60, 0.08) 0%, transparent 40%),
                  radial-gradient(circle at 15% 85%, rgba(255, 100, 100, 0.1) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .bubble {
      position: fixed;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff5e5e, #7a0000);
      opacity: 0.12;
      filter: blur(3px);
      animation: float 18s infinite ease-in-out;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-40px) scale(1.1); }
      100% { transform: translateY(0) scale(1); }
    }

    /* main card */
    .app-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1150px;
      background: rgba(10, 2, 2, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid rgba(255, 70, 70, 0.5);
      border-radius: 56px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8),
                  0 0 0 2px rgba(255, 40, 40, 0.2) inset,
                  0 0 40px rgba(255, 30, 30, 0.3);
      padding: 2.2rem 2rem 2.8rem;
      transition: box-shadow 0.3s;
    }

    .app-card:hover {
      box-shadow: 0 35px 70px rgba(180, 0, 0, 0.5),
                  0 0 0 2px rgba(255, 80, 80, 0.4) inset,
                  0 0 60px rgba(255, 30, 30, 0.4);
    }

    /* header */
    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo-icon {
      font-size: 2.8rem;
      filter: drop-shadow(0 0 15px #ff3b3b);
      animation: pulse 2.5s infinite;
      background: rgba(255, 40, 40, 0.1);
      padding: 10px;
      border-radius: 50%;
      border: 2px solid rgba(255, 70, 70, 0.4);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 25px #ff0000); }
    }

    .logo-text h1 {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ff6b6b, #ff1e1e, #ffb3b3);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
      text-shadow: 0 0 20px rgba(255, 40, 40, 0.5);
    }

    .logo-text .dev-badge {
      font-size: 0.9rem;
      font-weight: 500;
      color: #ff8a8a;
      background: rgba(255, 40, 40, 0.15);
      padding: 0.2rem 1rem;
      border-radius: 40px;
      border: 1px solid rgba(255, 70, 70, 0.4);
      letter-spacing: 1px;
      display: inline-block;
      backdrop-filter: blur(5px);
    }

    .dev-badge span {
      color: #ffd966;
      font-weight: 700;
      text-shadow: 0 0 8px #ff3b3b;
    }

    .wifi-badge {
      background: rgba(255, 50, 50, 0.18);
      border: 1.5px solid #ff4d4d;
      border-radius: 100px;
      padding: 0.6rem 1.5rem;
      font-weight: 600;
      color: #ffb3b3;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      backdrop-filter: blur(4px);
    }

    /* Layout panels */
    .panels {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 1.8rem;
      margin-bottom: 2rem;
    }

    .panel {
      background: rgba(20, 5, 5, 0.7);
      border-radius: 32px;
      padding: 1.8rem 1.5rem;
      border: 1.5px solid rgba(255, 70, 70, 0.35);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 100, 100, 0.1) inset;
      transition: transform 0.2s, border-color 0.2s;
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
    }

    .panel:hover {
      border-color: rgba(255, 100, 100, 0.7);
      transform: translateY(-3px);
    }

    .panel h2 {
      font-size: 1.5rem;
      color: #ffb3b3;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      letter-spacing: -0.3px;
      font-weight: 600;
      text-shadow: 0 0 15px rgba(255, 60, 60, 0.5);
    }

    /* UPLOAD area */
    .upload-area {
      border: 2px dashed #ff4d4d;
      border-radius: 24px;
      padding: 1.5rem 1rem;
      text-align: center;
      background: rgba(255, 40, 40, 0.05);
      transition: background 0.3s, border-color 0.3s;
      cursor: pointer;
      margin-bottom: 1rem;
    }

    .upload-area:hover {
      background: rgba(255, 60, 60, 0.12);
      border-color: #ff8080;
    }

    .upload-area .bubble-icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 0.5rem;
      filter: drop-shadow(0 0 12px #ff3b3b);
    }

    .upload-area p {
      color: #ffb3b3;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .upload-area small {
      color: #ff8a8a;
      font-size: 0.8rem;
      opacity: 0.8;
    }

    .upload-btn {
      background: linear-gradient(145deg, #b30000, #7a0000);
      border: none;
      border-radius: 60px;
      padding: 0.9rem 2rem;
      font-weight: 700;
      font-size: 1rem;
      color: #ffe6e6;
      cursor: pointer;
      box-shadow: 0 8px 0 #3d0000, 0 10px 25px rgba(255, 0, 0, 0.5);
      transition: all 0.1s ease;
      width: 100%;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 1rem;
    }

    .upload-btn:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 #3d0000, 0 8px 20px rgba(255, 0, 0, 0.5);
    }

    /* TEXT Sharing Area */
    .text-share-area {
      margin-top: 0.5rem;
      border-top: 1px solid rgba(255, 70, 70, 0.2);
      padding-top: 1.2rem;
    }

    .text-share-area textarea {
      width: 100%;
      background: rgba(255, 50, 50, 0.08);
      border: 1.5px solid rgba(255, 70, 70, 0.4);
      border-radius: 16px;
      padding: 12px;
      color: #ffd9d9;
      font-size: 0.95rem;
      resize: vertical;
      min-height: 80px;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
      margin-bottom: 0.8rem;
    }

    .text-share-area textarea:focus {
      border-color: #ff6b6b;
      background: rgba(255, 50, 50, 0.12);
    }

    .text-share-area textarea::placeholder {
      color: #a15555;
    }

    #fileInput {
      display: none;
    }

    /* FILES list */
    .files-list {
      flex: 1;
      overflow-y: auto;
      max-height: 480px;
      padding-right: 6px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .files-list::-webkit-scrollbar { width: 6px; }
    .files-list::-webkit-scrollbar-track { background: #1e0505; border-radius: 10px; }
    .files-list::-webkit-scrollbar-thumb { background: #ff4d4d; border-radius: 10px; border: 1px solid #7a0000; }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 40, 40, 0.1);
      border-radius: 20px;
      padding: 0.8rem 1rem;
      border: 1px solid rgba(255, 80, 80, 0.4);
      transition: background 0.2s;
      animation: fadeSlide 0.3s ease;
      gap: 10px;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .file-item:hover {
      background: rgba(255, 60, 60, 0.2);
      border-color: #ff6b6b;
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
      flex: 1;
    }

    .file-icon {
      font-size: 1.6rem;
      filter: drop-shadow(0 0 8px #ff4d4d);
    }

    .file-details {
      overflow: hidden;
      flex: 1;
    }

    .file-name {
      color: #ffd9d9;
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .file-size {
      font-size: 0.75rem;
      color: #ff9999;
      opacity: 0.8;
      margin-top: 2px;
    }

    /* Text preview in list */
    .text-preview {
      font-size: 0.8rem;
      color: #ffb3b3;
      font-style: italic;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-all;
      margin-top: 2px;
    }

    /* Actions */
    .action-group {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .action-btn {
      background: #a10000;
      border: none;
      border-radius: 50px;
      padding: 0.4rem 0.8rem;
      color: #ffe0e0;
      font-weight: 700;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 0 #3d0000;
      transition: 0.1s;
      border: 1px solid #ff6b6b;
      white-space: nowrap;
    }

    .action-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #3d0000;
    }

    .action-btn.erase {
      background: #2a0a0a;
      border-color: #7a0000;
      box-shadow: 0 3px 0 #110000;
    }
    
    .action-btn.erase:hover {
      background: #4d0000;
    }

    .empty-message {
      color: #a15555;
      text-align: center;
      padding: 2rem 0.5rem;
      font-style: italic;
      font-size: 0.95rem;
    }

    /* status bar */
    .status-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 80, 80, 0.3);
      color: #ffb3b3;
      font-size: 0.85rem;
      gap: 1rem;
    }

    .status-bar .dev-credit {
      font-weight: 500;
      background: rgba(255, 40, 40, 0.2);
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      border: 1px solid #ff4d4d;
      color: #ffc2c2;
    }

    .status-bar .dev-credit strong {
      color: #ffd966;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .status-bar .peer-count {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 60, 60, 0.1);
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
    }

    .dot {
      width: 10px;
      height: 10px;
      background: #ff3b3b;
      border-radius: 50%;
      box-shadow: 0 0 12px #ff3b3b;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* toast notification */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #2a0a0a;
      border: 2px solid #ff3b3b;
      color: #ffd9d9;
      padding: 0.9rem 2rem;
      border-radius: 60px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(255, 0, 0, 0.5), 0 0 30px #ff000080;
      z-index: 999;
      transition: opacity 0.3s, transform 0.3s;
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(10px);
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-10px);
    }

    /* responsive */
    @media (max-width: 800px) {
      .panels { grid-template-columns: 1fr; }
      .app-card { padding: 1.5rem 1.2rem; border-radius: 40px; }
      .header { flex-direction: column; align-items: flex-start; gap: 1rem; }
    }
  </style>
</head>
<body>
  <!-- floating bubbles -->
  <div class="bubble" style="width: 140px; height: 140px; top: 5%; left: -30px;"></div>
  <div class="bubble" style="width: 220px; height: 220px; bottom: 0; right: -50px; animation-duration: 22s;"></div>
  <div class="bubble" style="width: 80px; height: 80px; top: 30%; right: 10%; animation-duration: 14s;"></div>
  <div class="bubble" style="width: 300px; height: 300px; bottom: 20%; left: 20%; opacity: 0.06; animation-duration: 30s;"></div>

  <div class="app-card">
    <div class="header">
      <div class="logo-area">
        <!-- HACKER EMOJI ADDED HERE -->
        <div class="logo-icon">👨‍💻</div>
        <div class="logo-text">
          <h1>CozyShare</h1>
          <!-- UPDATED DEVELOPER TAG -->
          <div class="dev-badge">Developer: <span>KING_YOSEF_Andn</span></div>
        </div>
      </div>
      <div class="wifi-badge">
        <i>📶</i> same Wi-Fi / hotspot
      </div>
    </div>

    <div class="panels">
      <!-- LEFT PANEL: UPLOAD & TEXT -->
      <div class="panel">
        <h2><i>📤</i> Share something</h2>
        
        <!-- FILE UPLOAD -->
        <div class="upload-area" id="uploadArea">
          <span class="bubble-icon">📁</span>
          <p>Drop files or tap to browse</p>
          <small>any file · any size</small>
        </div>
        <input type="file" id="fileInput" multiple>
        <button class="upload-btn" id="uploadBtn">
          <span>⬆️</span> Upload File
        </button>

        <!-- TEXT SHARE -->
        <div class="text-share-area">
          <textarea id="textInput" placeholder="Or paste text here to share instantly..."></textarea>
          <button class="upload-btn" id="shareTextBtn" style="box-shadow: 0 6px 0 #3d0000, 0 8px 20px rgba(255, 0, 0, 0.5);">
            <span>💬</span> Share Text
          </button>
        </div>
      </div>

      <!-- RIGHT PANEL: SHARED ITEMS -->
      <div class="panel">
        <h2><i>📦</i> Shared items</h2>
        <div class="files-list" id="filesList">
          <!-- dynamic items appear here -->
          <div class="empty-message">✨ nothing here yet — share a file or text!</div>
        </div>
      </div>
    </div>

    <!-- status bar -->
    <div class="status-bar">
      <div class="peer-count">
        <span class="dot"></span>
        <span>live · <span id="itemCount">0</span> items shared</span>
      </div>
      <div class="dev-credit">
        🧑‍💻 Developer: <strong>KING_YOSEF_Andn</strong>
      </div>
    </div>
  </div>

  <!-- toast -->
  <div class="toast" id="toast">Shared successfully ✨</div>

  <script>
    (function() {
      // ---------- CONFIG ----------
      const STORAGE_KEY = 'cozy_share_v2_KING_YOSEF_Andn';

      // ---------- DOM refs ----------
      const fileInput = document.getElementById('fileInput');
      const uploadBtn = document.getElementById('uploadBtn');
      const uploadArea = document.getElementById('uploadArea');
      const textInput = document.getElementById('textInput');
      const shareTextBtn = document.getElementById('shareTextBtn');
      const filesList = document.getElementById('filesList');
      const itemCountSpan = document.getElementById('itemCount');
      const toastEl = document.getElementById('toast');

      // ---------- data ----------
      // Types: 'file', 'text'
      let sharedItems = [];

      // ---------- helper: show toast ----------
      function showToast(msg, duration = 2200) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(window.toastTimeout);
        window.toastTimeout = setTimeout(() => {
          toastEl.classList.remove('show');
        }, duration);
      }

      // ---------- format file size ----------
      function formatSize(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
      }

      // ---------- generate unique id ----------
      function generateId() {
        return Date.now() + '-' + Math.random().toString(36).substring(2, 11);
      }

      // ---------- persist to localStorage ----------
      function persistItems() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(sharedItems));
        } catch (e) {
          console.warn('LocalStorage error', e);
          showToast('⚠️ Storage limit reached!', 3000);
        }
      }

      // ---------- load from localStorage ----------
      function loadItemsFromStorage() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored) {
            const parsed = JSON.parse(stored);
            if (Array.isArray(parsed)) {
              sharedItems = parsed.filter(f => f && f.id && f.type);
            }
          }
        } catch (e) {
          console.warn('Failed to load items', e);
          sharedItems = [];
        }
      }

      // ---------- simple escape ----------
      function escapeHtml(unsafe) {
        if (!unsafe) return '';
        return unsafe
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      // ---------- file icon ----------
      function getFileIcon(name, mime) {
        const ext = name.split('.').pop().toLowerCase();
        if (['jpg','jpeg','png','gif','webp','svg','bmp'].includes(ext)) return '🖼️';
        if (['mp4','webm','mkv','mov','avi'].includes(ext)) return '🎬';
        if (['mp3','wav','ogg','flac','m4a'].includes(ext)) return '🎵';
        if (['pdf'].includes(ext)) return '📄';
        if (['doc','docx','txt','rtf','md'].includes(ext)) return '📝';
        if (['zip','rar','7z','tar','gz'].includes(ext)) return '🗜️';
        if (['exe','msi','app','bat'].includes(ext)) return '⚙️';
        if (mime && mime.startsWith('image/')) return '🖼️';
        if (mime && mime.startsWith('video/')) return '🎬';
        if (mime && mime.startsWith('audio/')) return '🎵';
        return '📁';
      }

      // ---------- render list ----------
      function renderItems() {
        if (!filesList) return;

        if (sharedItems.length === 0) {
          filesList.innerHTML = `<div class="empty-message">✨ nothing here yet — share a file or text!</div>`;
          itemCountSpan.textContent = '0';
          return;
        }

        const sorted = [...sharedItems].sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

        filesList.innerHTML = sorted.map(item => {
          if (item.type === 'text') {
            return `
              <div class="file-item" data-id="${item.id}">
                <div class="file-info">
                  <div class="file-icon">📝</div>
                  <div class="file-details">
                    <div class="file-name">Shared Text</div>
                    <div class="text-preview">${escapeHtml(item.content)}</div>
                  </div>
                </div>
                <div class="action-group">
                  <button class="action-btn" data-id="${item.id}" data-action="copy">📋 copy</button>
                  <button class="action-btn erase" data-id="${item.id}" data-action="erase">✖ erase</button>
                </div>
              </div>
            `;
          } else {
            const icon = getFileIcon(item.name, item.mime);
            const sizeStr = formatSize(item.size || 0);
            return `
              <div class="file-item" data-id="${item.id}">
                <div class="file-info">
                  <div class="file-icon">${icon}</div>
                  <div class="file-details">
                    <div class="file-name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div>
                    <div class="file-size">${sizeStr}</div>
                  </div>
                </div>
                <div class="action-group">
                  <button class="action-btn" data-id="${item.id}" data-action="download">⬇ get</button>
                  <button class="action-btn erase" data-id="${item.id}" data-action="erase">✖ erase</button>
                </div>
              </div>
            `;
          }
        }).join('');

        itemCountSpan.textContent = sharedItems.length;
      }

      // ---------- add files ----------
      function addFiles(fileList) {
        if (!fileList || fileList.length === 0) return;
        let readers = [];

        for (let i = 0; i < fileList.length; i++) {
          const file = fileList[i];
          const reader = new FileReader();
          const promise = new Promise((resolve, reject) => {
            reader.onload = (e) => {
              resolve({
                id: generateId(),
                type: 'file',
                name: file.name,
                size: file.size,
                mime: file.type || 'application/octet-stream',
                dataUrl: e.target.result,
                timestamp: Date.now()
              });
            };
            reader.onerror = (err) => reject(err);
          });
          reader.readAsDataURL(file);
          readers.push(promise);
        }

        Promise.all(readers)
          .then((newItems) => {
            sharedItems = [...sharedItems, ...newItems];
            persistItems();
            renderItems();
            showToast(`✨ ${newItems.length} file${newItems.length > 1 ? 's' : ''} added`);
            fileInput.value = '';
          })
          .catch((err) => {
            console.error('Error reading files', err);
            showToast('⚠️ error reading files', 2500);
            fileInput.value = '';
          });
      }

      // ---------- add text ----------
      function addText() {
        const text = textInput.value.trim();
        if (!text) {
          showToast('⚠️ Text is empty!', 2000);
          return;
        }

        const newItem = {
          id: generateId(),
          type: 'text',
          content: text,
          timestamp: Date.now()
        };

        sharedItems.push(newItem);
        persistItems();
        renderItems();
        showToast('💬 Text shared successfully!');
        textInput.value = '';
      }

      // ---------- handle actions (copy, download, erase) ----------
      filesList.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;

        const id = btn.getAttribute('data-id');
        const action = btn.getAttribute('data-action');
        const item = sharedItems.find(f => f.id === id);

        if (!item) return;

        if (action === 'download' && item.type === 'file') {
          const a = document.createElement('a');
          a.href = item.dataUrl;
          a.download = item.name || 'shared-file';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          showToast(`⬇️ downloading ${item.name}`, 1800);
        } 
        else if (action === 'copy' && item.type === 'text') {
          navigator.clipboard.writeText(item.content).then(() => {
            showToast('📋 Text copied to clipboard!', 1800);
          }).catch(err => {
            console.error('Copy failed', err);
            showToast('⚠️ Could not copy text', 2000);
          });
        } 
        else if (action === 'erase') {
          // filter out the item
          sharedItems = sharedItems.filter(f => f.id !== id);
          persistItems();
          renderItems();
          showToast('✖ Item erased for everyone', 2000);
        }
      });

      // ---------- trigger file input ----------
      uploadArea.addEventListener('click', () => fileInput.click());
      uploadBtn.addEventListener('click', (e) => {
        e.preventDefault();
        fileInput.click();
      });

      fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files.length > 0) {
          addFiles(e.target.files);
        }
      });

      // ---------- drag & drop ----------
      uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.style.background = 'rgba(255, 80, 80, 0.25)';
        uploadArea.style.borderColor = '#ffb3b3';
      });

      uploadArea.addEventListener('dragleave', () => {
        uploadArea.style.background = 'rgba(255, 40, 40, 0.05)';
        uploadArea.style.borderColor = '#ff4d4d';
      });

      uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.style.background = 'rgba(255, 40, 40, 0.05)';
        uploadArea.style.borderColor = '#ff4d4d';
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          addFiles(e.dataTransfer.files);
        }
      });

      // ---------- share text button ----------
      shareTextBtn.addEventListener('click', addText);

      // ---------- sync across tabs/devices ----------
      window.addEventListener('storage', (e) => {
        if (e.key === STORAGE_KEY) {
          loadItemsFromStorage();
          renderItems();
          if (e.newValue) {
            try {
              const newItems = JSON.parse(e.newValue);
              if (Array.isArray(newItems) && newItems.length > sharedItems.length) {
                showToast('🔄 new items arrived from another device', 1800);
              }
            } catch (err) {}
          }
        }
      });

      // ---------- init ----------
      function init() {
        loadItemsFromStorage();
        renderItems();
        if (sharedItems.length > 0) {
          showToast(`✨ ${sharedItems.length} item(s) ready`, 2200);
        }
      }

      init();

    })();
  </script>
</body>
</html>
